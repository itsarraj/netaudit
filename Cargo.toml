[package]
name = "netaudit"
version = "0.1.0"
edition = "2021"
description = "Which of your listening ports are reachable from the network, not just localhost — catches the exposed-dev-database mistake"
license = "MIT"
authors = ["Animesh Raj <animesh080808@gmail.com>"]
repository = "https://github.com/itsarraj/netaudit"
readme = "README.md"
keywords = ["security", "networking", "audit", "ports", "exposed"]
categories = ["command-line-utilities"]

[lib]
name = "netaudit"
path = "src/lib.rs"

[[bin]]
name = "netaudit"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
